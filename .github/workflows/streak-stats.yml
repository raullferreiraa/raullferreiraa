name: Atualizar card de contribuições

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Gerar card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=raullferreiraa&theme=dark&hide_border=true&locale=pt_BR&disable_animations=true
          path: assets/streak-stats.svg

      - name: Atualizar imagem no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar card de contribuições"
            git push
          fi
